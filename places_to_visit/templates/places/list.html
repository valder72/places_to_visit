{% extends 'base.html' %}

{% block content %}
<div class="list-header">
    <h2>Усі улюблені місця ({{ places|length }})</h2>
    <a href="{% url 'places_to_visit:add_place' %}" class="btn-primary">+ Додати нове</a>
</div>

<div class="places-grid">
    {% for place in places %}
        {% include 'includes/place_card.html' with place=place %}
    {% empty %}
        <p class="empty-text">Список поки порожній. Додайте своє перше місце!</p>
    {% endfor %}
</div>
{% endblock %}
